function useAppState() {
  const [threads, setThreads] = useState(() => JSON.parse(JSON.stringify(THREADS)));

  const flash = (m) => { setToast(m); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), 2200); };
  const upd = (id, fn) => setThreads(ts => ts.map(t => t.id === id ? fn({ ...t }) : t));
  const chan = (id) => channels.find(c => c.id === id);
  const canSee = (c) => !c.private || c.members.includes(ME);
  const isMember = (c) => c.members.includes(ME);
  const api = {
    threads, channels, prefs, toast, chan, canSee, isMember,
    visibleThreads: threads.filter(t => canSee(chan(t.channel))),
    get pinged() { return this.visibleThreads.filter(t => t.pings > 0 && isMember(chan(t.channel))).sort((a, b) => b.latest - a.latest); },
    get todo() { return this.visibleThreads.filter(t => t.todo).sort((a, b) => b.latest - a.latest); },
    pingsIn: (cid) => threads.filter(t => t.channel === cid && t.pings > 0).length,
    thread: (id) => threads.find(t => t.id === id),
    // Acknowledge: the four allowed ways. Viewing does nothing.
    markRead: (id) => { upd(id, t => ({ ...t, pings: 0 })); flash('Acknowledged: marked read'); },
    react: (id, e = '👍') => { upd(id, t => { const rs = t.responses.slice(); if (rs.length) { const l = { ...rs[rs.length - 1] }; l.reactions = [...l.reactions, e + ' 1']; rs[rs.length - 1] = l; } return { ...t, responses: rs, pings: 0, reactions: rs.length ? t.reactions : [...(t.reactions || []), e + ' 1'] }; }); flash('Acknowledged: reacted ' + e); },
    addTodo: (id) => { upd(id, t => ({ ...t, todo: true, pings: 0 })); flash('Acknowledged: added to To Do'); },
    doneTodo: (id) => { upd(id, t => ({ ...t, todo: false })); flash('Marked done, removed from To Do (Pings unaffected)'); },
    respond: (id, text, files) => { upd(id, t => ({ ...t, pings: 0, latest: 99 + Math.random(), responses: [...t.responses, R(ME, 'now', text || '(empty)', { attachments: files.map(f => ({ kind: f.kind, name: f.name, size: f.size })) })] })); flash('Acknowledged: Response sent'); },
    resolve: (id) => { upd(id, t => ({ ...t, status: t.status === 'open' ? 'resolved' : 'open' })); flash('Resolve/reopen does not touch anyone’s Pings'); },
    muteThread: (id) => upd(id, t => ({ ...t, mutedThread: !t.mutedThread })),
    muteChannel: (cid) => setChannels(cs => cs.map(c => c.id === cid ? { ...c, muted: !c.muted } : c)),
    join: (cid) => { setChannels(cs => cs.map(c => c.id === cid ? { ...c, members: [...c.members, ME] } : c)); flash('Joined. No Pings back-filled.'); },
    setPref: (cid, p) => setPrefs(ps => ({ ...ps, [cid]: { ...defaultPrefs, ...ps[cid], ...p } })),
    prefFor: (cid) => ({ ...defaultPrefs, ...prefs[cid] }),
  };
  return api;
}
const defaultPrefs = { status: 'open', pings: 'all', sort: 'latest', dir: 'desc' };
function channelThreads(S, cid) {
  const p = S.prefFor(cid);
  let ts = S.threads.filter(t => t.channel === cid);
  if (p.status !== 'all') ts = ts.filter(t => t.status === p.status);
  if (p.pings === 'with') ts = ts.filter(t => t.pings > 0);
  const k = p.sort === 'latest' ? 'latest' : 'started';
  ts.sort((a, b) => p.dir === 'desc' ? b[k] - a[k] : a[k] - b[k]);
  return ts;
}

      <span className="grow ellipsis"><${ChanName} c=${c} /></span>${S.pingsIn(c.id) > 0 && html`<span className=${'badge' + (c.muted ? ' grey' : '')}>${S.pingsIn(c.id)}</span>`}</div>`)}

    : cid ? html`<div><b><${ChanName} c=${S.chan(cid)} /></b><${ChannelMeta} c=${S.chan(cid)} S=${S} compact=${phone} /><${ListControls} S=${S} cid=${cid} /></div>` : null;

  if (phone) {
    const tab = (k, icon, label, n) => html`<button className=${(view === k || (k === 'channels' && cid)) ? 'on' : ''} onClick=${() => { setView(k); setOpenId(null); }}><span style=${{ fontSize: 18 }}>${icon}</span>${label}${n ? html` <span className="badge">${n}</span>` : ''}</button>`;
    if (view === 'search') return html`<${Search} S=${S} full autoOpen onClose=${() => setView('pings')} onOpenThread=${id => { setOpenId(id); setView('pings'); }} onOpenChannel=${id => setView('ch:' + id)} />`;
    return html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      ${t ? html`<div style=${{ flex: 1, minHeight: 0 }}><${ThreadPane} /></div>` : html`
        <div className="phone-head">${cid && html`<button className="ghost" onClick=${() => setView('channels')}>‹</button>`}<h3 className="grow">${view === 'pings' ? 'Pings' : view === 'todo' ? 'To Do' : view === 'channels' ? 'Channels' : ''}</h3><button className="ghost" onClick=${() => setView('search')}>🔍</button></div>
        <div className="phone-body" style=${{ background: '#fff' }}>
          ${cid && html`<div style=${{ padding: '8px 12px' }}>${listHead}</div>`}
          ${view === 'channels' ? html`<div className="A-nav" style=${{ border: 'none' }}><${ChannelsList} /></div>` : list.map(x => html`<${Row} key=${x.id} t=${x} />`)}
          ${view !== 'channels' && !list.length && html`<div className="muted" style=${{ padding: 20 }}>Nothing here.</div>`}
        </div>`}

    </div>`;

  return html`<div className="A-grid">
    <div className="A-top"><b style=${{ fontSize: 16 }}>Ping</b><${Search} S=${S} contextChannel=${cid} onOpenThread=${setOpenId} onOpenChannel=${id => setView('ch:' + id)} /><span className="grow"></span><${Avatar} who=${ME} /></div>
    <div className="A-nav">
      <div className=${'item' + (view === 'pings' ? ' on' : '')} onClick=${() => setView('pings')}>🔔 <span className="grow">Pings</span>${S.pinged.length > 0 && html`<span className="badge">${S.pinged.length}</span>`}</div>
      <div className=${'item' + (view === 'todo' ? ' on' : '')} onClick=${() => setView('todo')}>☑ <span className="grow">To Do</span><span className="badge grey">${S.todo.length}</span></div>
      <h4>Channels</h4><${ChannelsList} />
    </div>
    <div className="A-list"><div className="head">${listHead}</div><div className="scroll" style=${{ flex: 1 }}>${list.map(x => html`<${Row} key=${x.id} t=${x} />`)}${!list.length && html`<div className="muted" style=${{ padding: 20 }}>Nothing here.</div>`}</div></div>
    <${ThreadPane} />
  </div>`;
}

/* ================================================================== Variant B: channel-first, Pings in a bell */
function VariantB({ phone }) {
  const S = useApp();
  const [cid, setCid] = useState('front-desk'); // or 'todo'
  const [openId, setOpenId] = useState(null);
  const [bell, setBell] = useState(false);
  const [screen, setScreen] = useState('home'); // phone: home | channel | thread | pings | search
  const t = openId && S.thread(openId);
  const openThread = (id) => { setOpenId(id); setBell(false); if (phone) setScreen('thread'); else setCid(S.thread(id).channel); };
  const InlineAck_ = ({ t }) => html`<div className="inline-ack" onClick=${e => e.stopPropagation()}>
    <button className="small" title="Mark read" disabled=${!t.pings} onClick=${() => S.markRead(t.id)}>✓</button>
    <button className="small" title="React 👍" onClick=${() => S.react(t.id)}>👍</button>
    <button className="small" title=${t.todo ? 'Done' : 'Add to To Do'} onClick=${() => t.todo ? S.doneTodo(t.id) : S.addTodo(t.id)}>${t.todo ? '☑' : '☐'}</button>
  </div>`;
  const Card_ = ({ t, showChan }) => {
    const last = t.responses[t.responses.length - 1];
    return html`<div className=${'B-card' + (t.pings ? ' hasping' : '') + (t.id === openId ? ' on' : '')} onClick=${() => openThread(t.id)}>
      <div className="row"><${Avatar} who=${t.author} size=${22} /><span className="small"><${Name} who=${t.author} /></span><span className="small muted">${t.at}</span><span className="grow"></span><${InlineAck} t=${t} /></div>
      ${showChan && html`<div className="small muted"><${ChanName} c=${S.chan(t.channel)} /></div>`}
      <div style=${{ fontWeight: 700, margin: '4px 0' }}>${t.title} ${t.status === 'resolved' && html`<span className="pill resolved">Resolved</span>`}</div>
      <div className="small ellipsis"><${Rich} text=${t.body} /></div>
      <div className="row small muted" style=${{ marginTop: 6 }}>
        <span>💬 ${t.responses.length} Responses</span>${t.attachments.length > 0 && html`<span>📎 ${t.attachments.length}</span>`}
        ${t.pings > 0 && html`<span className="pill new">${t.pings} new</span>`}${t.mention && t.pings ? html`<span className="mention">@You</span>` : ''}${t.todo ? html`<span className="pill">☑ To Do</span>` : ''}${t.mutedThread ? '🔕' : ''}
        ${last && html`<span className="grow ellipsis">Latest: ${PEOPLE[last.author].name.split(' ')[0]}: ${last.body}</span>`}
      </div>
    </div>`;
  };
  const Panel_ = () => t && html`<div className=${phone ? '' : 'B-panel'} style=${phone ? { display: 'flex', flexDirection: 'column', height: '100%', background: '#fff' } : {}}>
    <div style=${{ padding: '10px 14px', borderBottom: '1px solid var(--line)' }}>
      <div className="row"><button className="ghost" onClick=${() => { setOpenId(null); if (phone) setScreen(S.chan(t.channel) ? 'channel' : 'home'); }}>${phone ? '‹ Back' : '✕'}</button><span className="grow"></span>
        <button onClick=${() => S.markRead(t.id)} disabled=${!t.pings}>✓ Read</button><button onClick=${() => S.react(t.id)}>👍</button>
        <button onClick=${() => t.todo ? S.doneTodo(t.id) : S.addTodo(t.id)}>${t.todo ? '☑ Done' : '☐ To Do'}</button></div>
      <${ThreadHeader} t=${t} S=${S} compact />
    </div>
    <div className="scroll" style=${{ flex: 1, padding: '8px 14px' }}><${ThreadBody} t=${t} S=${S} /></div>
    <div style=${{ padding: 8, borderTop: '1px solid var(--line)' }}><${Composer} key=${t.id} compact=${phone} onSend=${(x, f) => S.respond(t.id, x, f)} /></div>
  </div>`;
  const PingsList_ = () => html`<div>${S.pinged.map(t => html`<div key=${t.id} className="B-drop-r r" style=${{ padding: '8px 10px', borderBottom: '1px solid #f1f0ec', cursor: 'pointer' }} onClick=${() => openThread(t.id)}>
    <div className="row small muted"><${ChanName} c=${S.chan(t.channel)} /><span className="grow"></span>${t.at}</div>
    <div className="row"><b className="grow ellipsis">${t.title}</b><span className="badge">${t.pings}</span></div>
    <div className="row small"><span className="grow muted ellipsis">${(t.responses[t.responses.length - 1] || t).body}</span><${InlineAck} t=${t} /></div>
  </div>`)}${!S.pinged.length && html`<div className="muted" style=${{ padding: 16 }}>All Pings acknowledged.</div>`}</div>`;
  const Feed_ = () => {
    if (cid === 'todo') return html`<div className="B-feed"><h3>To Do</h3>${S.todo.map(t => html`<${Card} key=${t.id} t=${t} showChan />`)}</div>`;
    const c = S.chan(cid);
    return html`<div className="B-feed">
      <div style=${{ position: 'sticky', top: 0, background: 'var(--bg)', padding: '6px 0', zIndex: 2 }}>
        <div className="row"><h3 style=${{ margin: 0 }} className="grow"><${ChanName} c=${c} /></h3>${!S.isMember(c) ? html`<button className="primary" onClick=${() => S.join(c.id)}>Join</button>` : html`<button className="primary">+ New Thread</button>`}</div>
        <${ChannelMeta} c=${c} S=${S} compact=${phone} /><${ListControls} S=${S} cid=${cid} />
        <div className="small muted">${S.prefFor(cid).status === 'open' ? `${S.threads.filter(x => x.channel === cid && x.status === 'resolved').length} Resolved threads hidden` : ''}</div>
      </div>
      ${channelThreads(S, cid).map(t => html`<${Card} key=${t.id} t=${t} />`)}
    </div>`;
  };
  const Side_ = ({ asList }) => html`<div className=${asList ? '' : 'B-side'} style=${asList ? { padding: 8 } : {}}>
    ${!asList && html`<div className="row" style=${{ padding: '4px 8px 10px', color: '#fff' }}><b className="grow" style=${{ fontSize: 16 }}>Ping</b></div>`}
    <div className=${'item' + (cid === 'todo' && !asList ? ' on' : '')} style=${asList ? { padding: 10, background: '#fff', border: '1px solid var(--line)', borderRadius: 10, marginBottom: 8 } : {}} onClick=${() => { setCid('todo'); setOpenId(null); if (asList) setScreen('channel'); }}>☑ <span className="grow">To Do</span><span className="badge grey">${S.todo.length}</span></div>
    <h4 style=${asList ? { color: 'var(--muted)' } : {}}>Channels</h4>
    ${S.channels.filter(c => S.isMember(c)).map(c => html`<div key=${c.id} className=${'item' + (cid === c.id && !asList ? ' on' : '') + (S.pingsIn(c.id) ? ' has' : '')} style=${asList ? { padding: 10, background: '#fff', border: '1px solid var(--line)', borderRadius: 10, marginBottom: 6 } : {}} onClick=${() => { setCid(c.id); setOpenId(null); if (asList) setScreen('channel'); }}>
      <span className="grow ellipsis"><${ChanName} c=${c} /></span>${S.pingsIn(c.id) > 0 && html`<span className=${'badge' + (c.muted ? ' grey' : '')}>${S.pingsIn(c.id)}</span>`}</div>`)}
    <${JoinList} S=${S} onOpen=${id => { setCid(id); if (asList) setScreen('channel'); }} />
  </div>`;
  const BellBtn_ = () => html`<button onClick=${() => phone ? setScreen('pings') : setBell(b => !b)} style=${{ position: 'relative' }}>🔔 ${S.pinged.length > 0 && html`<span className="badge">${S.pinged.length}</span>`}</button>`;

  const InlineAck = useStable(InlineAck_);
  const Card = useStable(Card_);
  const Panel = useStable(Panel_);
  const PingsList = useStable(PingsList_);
  const Feed = useStable(Feed_);
  const Side = useStable(Side_);
  const BellBtn = useStable(BellBtn_);
  if (phone) {
    if (screen === 'search') return html`<${Search} S=${S} full autoOpen onClose=${() => setScreen('home')} onOpenThread=${openThread} onOpenChannel=${id => { setCid(id); setScreen('channel'); }} />`;
    if (screen === 'thread' && t) return html`<${Panel} />`;
    return html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <div className="phone-head">${screen !== 'home' && html`<button className="ghost" onClick=${() => setScreen('home')}>‹</button>`}<h3 className="grow">${screen === 'home' ? 'Ping' : screen === 'pings' ? 'Pings' : cid === 'todo' ? 'To Do' : ''}</h3><button className="ghost" onClick=${() => setScreen('search')}>🔍</button><${BellBtn} /></div>
      <div className="phone-body">${screen === 'home' ? html`<${Side} asList />` : screen === 'pings' ? html`<div style=${{ background: '#fff' }}><${PingsList} /></div>` : html`<${Feed} />`}</div>
    </div>`;
  }
  return html`<div className="B-grid">
    <${Side} />
    <div className="B-main">
      <div className="B-top"><${Search} S=${S} contextChannel=${cid !== 'todo' ? cid : null} onOpenThread=${openThread} onOpenChannel=${setCid} /><span className="grow"></span><${BellBtn} /><${Avatar} who=${ME} /></div>
      ${bell && html`<div className="B-drop"><div className="row" style=${{ padding: '8px 10px', borderBottom: '1px solid var(--line)' }}><b className="grow">Pings</b><span className="small muted">opening one does not clear it</span></div><${PingsList} /></div>`}
      <div className="scroll" style=${{ flex: 1 }}><${Feed} /></div>
      <${Panel} />
    </div>
  </div>`;
}

/* ================================================================== Variant C: focus queue, one Ping at a time */
function VariantC({ phone }) {
  const S = useApp();
  const [tab, setTab] = useState('queue'); // queue | todo | channels | search
  const [curId, setCurId] = useState(null);
  const [cid, setCid] = useState(null);
  const [openId, setOpenId] = useState(null); // non-queue Thread view
  const [skipped, setSkipped] = useState([]);
  const [respond, setRespond] = useState(0);
  const queue = S.pinged.slice().sort((a, b) => skipped.indexOf(a.id) - skipped.indexOf(b.id));
  const cur = (curId && queue.find(x => x.id === curId)) || queue[0];
  const idx = cur ? queue.indexOf(cur) : -1;
  const next = () => { const n = queue[idx + 1] || queue[0]; setCurId(n && n.id !== cur.id ? n.id : null); };
  const actAndNext = (fn) => { const n = queue[idx + 1]; fn(); setCurId(n ? n.id : null); };
  const Actions_ = ({ t, inQueue }) => phone ? html`<div className="C-phone-actions">
      <button onClick=${() => inQueue ? actAndNext(() => S.markRead(t.id)) : S.markRead(t.id)}><span style=${{ fontSize: 18 }}>✓</span>Mark read</button>
      <button onClick=${() => inQueue ? actAndNext(() => S.react(t.id)) : S.react(t.id)}><span style=${{ fontSize: 18 }}>👍</span>React</button>
      <button onClick=${() => inQueue ? actAndNext(() => S.addTodo(t.id)) : (t.todo ? S.doneTodo(t.id) : S.addTodo(t.id))}><span style=${{ fontSize: 18 }}>☐</span>${t.todo && !inQueue ? 'Done' : 'To Do'}</button>
      <button onClick=${() => setRespond(x => x + 1)}><span style=${{ fontSize: 18 }}>↩</span>Respond</button>
    </div>` : html`<div className="C-actions">
      <button className="big" onClick=${() => inQueue ? actAndNext(() => S.markRead(t.id)) : S.markRead(t.id)}>✓ Mark read${inQueue ? ' & next' : ''}</button>
      <button className="big" onClick=${() => inQueue ? actAndNext(() => S.react(t.id)) : S.react(t.id)}>👍 React${inQueue ? ' & next' : ''}</button>
      <button className="big" onClick=${() => inQueue ? actAndNext(() => S.addTodo(t.id)) : (t.todo ? S.doneTodo(t.id) : S.addTodo(t.id))}>${t.todo && !inQueue ? '☑ Done' : '☐ To Do' + (inQueue ? ' & next' : '')}</button>
      <button className="big primary" onClick=${() => setRespond(x => x + 1)}>↩ Respond</button>
    </div>`;
  const Focus_ = ({ t, inQueue }) => html`<div className=${phone ? '' : 'C-card'} style=${phone ? { padding: 12, background: '#fff' } : {}}>
    ${inQueue && html`<div className="row small muted" style=${{ marginBottom: 6 }}><span className="grow">Ping ${idx + 1} of ${queue.length}</span><button className="small" onClick=${() => { setSkipped(s => [...s.filter(x => x !== t.id), t.id]); next(); }}>Skip (stays a Ping) →</button></div>`}
    ${!inQueue && html`<button className="ghost small" onClick=${() => setOpenId(null)}>‹ Back</button>`}
    <${ThreadHeader} t=${t} S=${S} compact=${phone} />
    ${!phone && html`<${Actions} t=${t} inQueue=${inQueue} />`}
    <${ThreadBody} key=${t.id} t=${t} S=${S} onlyNewPlusContext=${inQueue} />
    ${(respond > 0 || !phone) && html`<div style=${{ marginTop: 10 }}><${Composer} key=${t.id + respond} autoFocus=${respond > 0} compact=${phone} onSend=${(x, f) => { inQueue ? actAndNext(() => S.respond(t.id, x, f)) : S.respond(t.id, x, f); setRespond(0); }} /></div>`}
  </div>`;
  const Done_ = () => html`<div className=${phone ? '' : 'C-card'} style=${{ textAlign: 'center', padding: 40 }}><div style=${{ fontSize: 40 }}>✓</div><h2>All Pings acknowledged</h2><div className="muted">Next: your To Do (${S.todo.length})</div><button style=${{ marginTop: 12 }} onClick=${() => setTab('todo')}>Open To Do</button></div>`;
  const TodoList_ = () => html`<div className="card-list" style=${{ maxWidth: 760, margin: '0 auto' }}>${S.todo.map(t => html`<div key=${t.id} className="li" onClick=${() => setOpenId(t.id)}>
    <div className="row"><input type="checkbox" title="Mark done" onClick=${e => { e.stopPropagation(); S.doneTodo(t.id); }} /><b className="grow ellipsis">${t.title}</b>${t.pings > 0 && html`<span className="badge">${t.pings}</span>`}</div>
    <div className="small muted"><${ChanName} c=${S.chan(t.channel)} /> · ${t.at}</div></div>`)}${!S.todo.length && html`<div className="muted">Your To Do is empty.</div>`}</div>`;
  const Channels_ = () => {
    const c = cid && S.chan(cid);
    const list = html`<div className="card-list">${S.channels.filter(S.isMember).map(c => html`<div key=${c.id} className="li row" onClick=${() => setCid(c.id)}><span className="grow"><${ChanName} c=${c} /><div className="small muted">${c.desc}</div></span>${S.pingsIn(c.id) > 0 && html`<span className=${'badge' + (c.muted ? ' grey' : '')}>${S.pingsIn(c.id)}</span>`}</div>`)}<${JoinList} S=${S} onOpen=${setCid} /></div>`;
    const view = c && html`<div>
      ${phone && html`<button className="ghost small" onClick=${() => setCid(null)}>‹ Channels</button>`}
      <h3 style=${{ margin: '4px 0' }}><${ChanName} c=${c} /></h3><${ChannelMeta} c=${c} S=${S} compact=${phone} /><${ListControls} S=${S} cid=${c.id} />
      <div className="card-list">${channelThreads(S, c.id).map(t => html`<div key=${t.id} className="li" onClick=${() => setOpenId(t.id)}><div className="row"><b className="grow ellipsis">${t.system ? '⚙ ' : ''}${t.title}</b>${t.pings > 0 && html`<span className="badge">${t.pings}</span>`}</div><div className="small muted ellipsis">${t.responses.length} Responses · ${t.at} ${t.status === 'resolved' ? '· Resolved' : ''}</div></div>`)}</div>
    </div>`;
    if (phone) return html`<div style=${{ padding: 12 }}>${c ? view : list}</div>`;
    return html`<div style=${{ display: 'grid', gridTemplateColumns: '280px 1fr', gap: 20, maxWidth: 1100, margin: '0 auto' }}>${list}<div>${view || html`<div className="muted">Pick a Channel.</div>`}</div></div>`;
  };
  const Actions = useStable(Actions_);
  const Focus = useStable(Focus_);
  const Done = useStable(Done_);
  const TodoList = useStable(TodoList_);
  const Channels = useStable(Channels_);
  const open = openId && S.thread(openId);
  const seg = html`<div className="C-seg">${[['queue', `Pings ${queue.length}`], ['todo', `To Do ${S.todo.length}`], ['channels', 'Channels']].map(([k, l]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => { setTab(k); setOpenId(null); }}>${l}</button>`)}</div>`;
  const content = open ? html`<${Focus} t=${open} inQueue=${false} />`
    : tab === 'queue' ? (cur ? html`<${Focus} t=${cur} inQueue=${true} />` : html`<${Done} />`)
    : tab === 'todo' ? html`<${TodoList} />` : html`<${Channels} />`;
  const focusT = open || (tab === 'queue' && cur);

  if (phone) {
    if (tab === 'search') return html`<${Search} S=${S} full autoOpen onClose=${() => setTab('queue')} onOpenThread=${id => { setOpenId(id); setTab('channels'); }} onOpenChannel=${id => { setCid(id); setTab('channels'); }} />`;
    return html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <div className="phone-head">${seg}<span className="grow"></span><button className="ghost" onClick=${() => setTab('search')}>🔍</button></div>
      <div className="phone-body">${content}</div>
      ${focusT && html`<${Actions} t=${focusT} inQueue=${!open} />`}
    </div>`;
  }
  return html`<div className="C-wrap">
    <div className="C-top"><b style=${{ fontSize: 16 }}>Ping</b>${seg}<${Search} S=${S} contextChannel=${cid} onOpenThread=${id => setOpenId(id)} onOpenChannel=${id => { setCid(id); setTab('channels'); setOpenId(null); }} /><${Avatar} who=${ME} /></div>
    ${tab === 'queue' && !open ? html`<div className="C-body">
      <div className="C-queue"><div className="small muted" style=${{ padding: '8px 12px' }}>Up next</div>${queue.map((t, i) => html`<div key=${t.id} className=${'q' + (cur && t.id === cur.id ? ' on' : '')} onClick=${() => setCurId(t.id)}><div className="row"><span className="grow ellipsis">${t.title}</span><span className="badge">${t.pings}</span></div><div className="small muted"><${ChanName} c=${S.chan(t.channel)} />${t.mention ? ' · @You' : ''}${skipped.includes(t.id) ? ' · skipped' : ''}</div></div>`)}</div>
      <div className="C-focus">${content}</div>
    </div>` : html`<div className="C-focus" style=${{ flex: 1 }}>${content}</div>`}
  </div>`;
}

/* ================================================================== Variant B2: B revised after Patrick's feedback
   Dark top bar + dark sidebar (Slack-like). Main area = per-Channel white Channel bar, grey Thread feed below.
   Sidebar shows only Channels you're in, grouped into your own Sections (drag Channels between them).
   Public channels you haven't joined are found only through search or "Browse channels". */
function VariantB2({ phone }) {
  const S = useApp();
  const [view, setView] = useState('ch:front-desk'); // pings | todo | browse | ch:<id>
  const [openId, setOpenId] = useState(null);
  const [screen, setScreen] = useState('home'); // phone: home | main | thread | search
  const [sections, setSections] = useState([
    { id: 's-admin', name: 'Front office', collapsed: false, channels: ['front-desk', 'owners', 'hr-notices'] },
    { id: 's-teach', name: 'Teaching', collapsed: false, channels: ['teaching-b1', 'teaching-c1', 'teachers-room'] },
    { id: 's-tours', name: 'Tours', collapsed: false, channels: ['tours-ops'] },
    { id: 's-build', name: 'Building', collapsed: true, channels: ['maintenance'] },
  ]);
  const [drag, setDrag] = useState(null);
  const [overSec, setOverSec] = useState(null);
  const cid = view.startsWith('ch:') ? view.slice(3) : null;
  const t = openId && S.thread(openId);
  const mine = S.channels.filter(S.isMember);
  const sorted = new Set(sections.flatMap(s => s.channels));
  const unsorted = mine.filter(c => !sorted.has(c.id)).map(c => c.id);
  const allSections = [...sections.map(s => ({ ...s, channels: s.channels.filter(id => mine.some(c => c.id === id)) })), { id: 's-default', name: 'Channels', collapsed: false, channels: unsorted, isDefault: true }];
  const moveTo = (chId, secId) => setSections(ss => ss.map(s => ({ ...s, channels: s.id === secId ? [...s.channels.filter(x => x !== chId), chId] : s.channels.filter(x => x !== chId) })));
  const sectionOf = (chId) => (sections.find(s => s.channels.includes(chId)) || { id: 's-default' }).id;
  const newSection = () => { const n = prompt('Name the new Section (only you see it)', 'HR'); if (n) setSections(ss => [...ss, { id: 's' + Math.random(), name: n, collapsed: false, channels: [] }]); };
  const toggle = (secId) => setSections(ss => ss.map(s => s.id === secId ? { ...s, collapsed: !s.collapsed } : s));
  const go = (v) => { setView(v); setOpenId(null); if (phone) setScreen('main'); };
  const openThread = (id) => { setOpenId(id); if (phone) setScreen('thread'); };

  const InlineAck_ = ({ t }) => html`<div className="inline-ack" onClick=${e => e.stopPropagation()}>
    <button className="small" title="Mark read" disabled=${!t.pings} onClick=${() => S.markRead(t.id)}>✓</button>
    <button className="small" title="React 👍" onClick=${() => S.react(t.id)}>👍</button>
    <button className="small" title=${t.todo ? 'Done' : 'Add to To Do'} onClick=${() => t.todo ? S.doneTodo(t.id) : S.addTodo(t.id)}>${t.todo ? '☑' : '☐'}</button>
  </div>`;
  const Row_ = ({ t, showChan }) => {
    const last = t.responses[t.responses.length - 1];
    return html`<div className=${'B2-row' + (t.pings ? ' hasping' : '') + (t.id === openId ? ' on' : '')} onClick=${() => openThread(t.id)}>
      <${Avatar} who=${t.author} size=${32} />
      <div className="grow">
        <div className="row small"><${Name} who=${t.author} /><span className="muted">${t.at}</span>${showChan && html`<span className="muted">in <${ChanName} c=${S.chan(t.channel)} /></span>`}<span className="grow"></span>${!phone && html`<${InlineAck} t=${t} />`}</div>
        <div style=${{ fontWeight: 700, margin: '2px 0', fontSize: 15 }}>${t.title} ${t.status === 'resolved' && html`<span className="pill resolved">Resolved</span>`}</div>
        <div className="small" style=${phone ? { display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' } : {}}><${Rich} text=${t.body} /></div>
        <${Attachments} list=${t.attachments.slice(0, phone ? 1 : 3)} />
        <div className="row small" style=${{ marginTop: 6, flexWrap: 'wrap' }}>
          <span className="B2-replies">${t.responses.length} Responses</span>
          ${t.pings > 0 && html`<span className="pill new">${t.pings} new</span>`}${t.mention && t.pings ? html`<span className="mention">@You</span>` : ''}${t.todo ? html`<span className="pill">☑ To Do</span>` : ''}${t.mutedThread ? '🔕' : ''}
          ${last && !phone && html`<span className="muted grow ellipsis">Latest ${last.at}: ${PEOPLE[last.author].name.split(' ')[0]}: ${last.body}</span>`}
        </div>
        ${phone && html`<div style=${{ marginTop: 6 }}><${InlineAck} t=${t} /></div>`}
      </div>
    </div>`;
  };
  const Panel_ = () => t && html`<div className=${phone ? '' : 'B-panel'} style=${phone ? { display: 'flex', flexDirection: 'column', height: '100%', background: '#fff' } : {}}>
    <div style=${{ padding: '10px 14px', borderBottom: '1px solid var(--line)' }}>
      <div className="row"><button className="ghost" onClick=${() => { setOpenId(null); if (phone) setScreen('main'); }}>${phone ? '‹ Back' : '✕'}</button><b className="grow">Thread</b>
        <button onClick=${() => S.markRead(t.id)} disabled=${!t.pings}>✓ Read</button><button onClick=${() => S.react(t.id)}>👍</button>
        <button onClick=${() => t.todo ? S.doneTodo(t.id) : S.addTodo(t.id)}>${t.todo ? '☑ Done' : '☐ To Do'}</button></div>
      <${ThreadHeader} t=${t} S=${S} compact />
    </div>
    <div className="scroll" style=${{ flex: 1, padding: '8px 14px' }}><${ThreadBody} t=${t} S=${S} /></div>
    <div style=${{ padding: 8, borderTop: '1px solid var(--line)' }}><${Composer} key=${t.id} compact=${phone} onSend=${(x, f) => S.respond(t.id, x, f)} /></div>
  </div>`;
  const ChannelBar_ = ({ c }) => {
    const hidden = S.threads.filter(x => x.channel === c.id && x.status === 'resolved').length;
    return html`<div className="B2-chanbar">
      <div className="row">
        ${phone && html`<button className="ghost" onClick=${() => setScreen('home')}>‹</button>`}
        <h2 className="grow ellipsis" style=${{ margin: 0, fontSize: phone ? 17 : 19 }}><${ChanName} c=${c} /></h2>
        ${!phone && html`<span className="small muted" title=${c.members.map(m => PEOPLE[m].name + (PEOPLE[m].deactivated ? ' (Deactivated)' : '')).join(', ')}>👤 ${c.members.length}</span>`}
        ${S.isMember(c) ? html`<button className="small" onClick=${() => S.muteChannel(c.id)}>${c.muted ? '🔕 Muted' : '🔔'}</button>` : html`<button className="primary" onClick=${() => S.join(c.id)}>Join Channel</button>`}
        ${S.isMember(c) && html`<button className="primary">+ ${phone ? 'Thread' : 'New Thread'}</button>`}
      </div>
      ${!phone && html`<div className="small muted ellipsis" style=${{ marginTop: 2 }}>${c.desc}</div>`}
      <div className="row B2-tabs">
        <span className="B2-tab on">Threads</span>
        ${!phone && html`<span className="B2-tab">Files</span><span className="B2-tab">Members</span>`}
        <span className="grow"></span>
        ${S.isMember(c) && !phone && html`<span className="small muted">Section: <select value=${sectionOf(c.id)} onChange=${e => moveTo(c.id, e.target.value)}>${allSections.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></span>`}
      </div>
      <div className="row" style=${{ flexWrap: 'wrap' }}><${ListControls} S=${S} cid=${c.id} />${S.prefFor(c.id).status === 'open' && hidden > 0 && html`<span className="small muted">${hidden} Resolved hidden</span>`}</div>
    </div>`;
  };
  const SimpleBar_ = ({ title, sub }) => html`<div className="B2-chanbar"><div className="row">${phone && html`<button className="ghost" onClick=${() => setScreen('home')}>‹</button>`}<h2 className="grow" style=${{ margin: 0, fontSize: phone ? 17 : 19 }}>${title}</h2></div><div className="small muted">${sub}</div></div>`;
  const Main_ = () => {
    if (view === 'pings') return html`<${SimpleBar} title="Pings" sub="Threads with new activity for you. Opening one does not clear it." /><div className="B2-feed">${S.pinged.map(t => html`<${Row} key=${t.id} t=${t} showChan />`)}${!S.pinged.length && html`<div className="muted" style=${{ padding: 20 }}>All Pings acknowledged.</div>`}</div>`;
    if (view === 'todo') return html`<${SimpleBar} title="To Do" sub="Your personal list. Threads here still get Pings." /><div className="B2-feed">${S.todo.map(t => html`<${Row} key=${t.id} t=${t} showChan />`)}</div>`;
    if (view === 'browse') return html`<${Browse} />`;
    const c = S.chan(cid);
    return html`<${ChannelBar} c=${c} /><div className="B2-feed">${channelThreads(S, cid).map(t => html`<${Row} key=${t.id} t=${t} />`)}${!channelThreads(S, cid).length && html`<div className="muted" style=${{ padding: 20 }}>No Threads match.</div>`}</div>`;
  };
  const Browse_ = () => {
    const [q, setQ] = useState('');
    const list = S.channels.filter(c => !c.private && (c.name + c.desc).toLowerCase().includes(q.toLowerCase()));
    return html`<${SimpleBar} title="Browse channels" sub="Every Public channel. Private channels only appear to their members." />
      <div className="B2-feed"><input placeholder="Filter Public channels" value=${q} onInput=${e => setQ(e.target.value)} style=${{ width: '100%', padding: 8, border: '1px solid var(--line)', borderRadius: 8, marginBottom: 8 }} />
      ${list.map(c => html`<div key=${c.id} className="B2-row" style=${{ alignItems: 'center' }} onClick=${() => go('ch:' + c.id)}><div className="grow"><b># ${c.name}</b><div className="small muted">${c.desc} · ${c.members.length} members</div></div>${S.isMember(c) ? html`<span className="small muted">Joined</span>` : html`<button onClick=${e => { e.stopPropagation(); S.join(c.id); }}>Join</button>`}</div>`)}</div>`;
  };
  const ChanItem_ = ({ id }) => {
    const c = S.chan(id); const n = S.pingsIn(id);
    return html`<div className=${'item' + (view === 'ch:' + id ? ' on' : '') + (n ? ' has' : '')} draggable=${!phone} onDragStart=${() => setDrag(id)} onDragEnd=${() => { setDrag(null); setOverSec(null); }} onClick=${() => go('ch:' + id)}>
      <span className="grow ellipsis"><${ChanName} c=${c} /></span>${n > 0 && html`<span className=${'badge' + (c.muted ? ' grey' : '')}>${n}</span>`}</div>`;
  };
  const Side_ = () => html`<div className=${phone ? 'B2-side phone' : 'B2-side'}>
    <div className=${'item' + (view === 'pings' ? ' on' : '') + (S.pinged.length ? ' has' : '')} onClick=${() => go('pings')}>🔔 <span className="grow">Pings</span>${S.pinged.length > 0 && html`<span className="badge">${S.pinged.length}</span>`}</div>
    <div className=${'item' + (view === 'todo' ? ' on' : '')} onClick=${() => go('todo')}>☑ <span className="grow">To Do</span><span className="small" style=${{ opacity: .7 }}>${S.todo.length}</span></div>
    <div className="B2-hr"></div>
    ${allSections.map(s => {
      const shown = s.collapsed ? s.channels.filter(id => S.pingsIn(id) > 0 || view === 'ch:' + id) : s.channels;
      return html`<div key=${s.id} className=${'B2-sec' + (overSec === s.id ? ' over' : '')}
        onDragOver=${e => { e.preventDefault(); setOverSec(s.id); }} onDragLeave=${() => setOverSec(null)}
        onDrop=${e => { e.preventDefault(); if (drag) moveTo(drag, s.id); setDrag(null); setOverSec(null); }}>
        <div className="B2-sechead" onClick=${() => !s.isDefault && toggle(s.id)}>${s.isDefault ? '▾' : s.collapsed ? '▸' : '▾'} ${s.name}</div>
        ${shown.map(id => html`<${ChanItem} key=${id} id=${id} />`)}
        ${s.channels.length === 0 && html`<div className="B2-empty">${phone ? 'Empty' : 'Drag Channels here'}</div>`}
      </div>`;
    })}
    <div className="B2-hr"></div>
    <div className="item" onClick=${newSection}>＋ <span className="grow">New section</span></div>
    <div className="item" onClick=${() => go('browse')}>⌕ <span className="grow">Browse channels</span></div>
    <div className="item">＋ <span className="grow">Create channel</span></div>
  </div>`;
  const InlineAck = useStable(InlineAck_);
  const Row = useStable(Row_);
  const Panel = useStable(Panel_);
  const ChannelBar = useStable(ChannelBar_);
  const SimpleBar = useStable(SimpleBar_);
  const Main = useStable(Main_);
  const Browse = useStable(Browse_);
  const ChanItem = useStable(ChanItem_);
  const Side = useStable(Side_);
  const Top = html`<div className="B2-top">
    ${phone ? html`<b style=${{ fontSize: 17 }} className="grow">Ping</b><button className="ghost" style=${{ color: '#fff' }} onClick=${() => setScreen('search')}>🔍</button>`
      : html`<b style=${{ fontSize: 16, width: 240 }}>Ping</b><div className="grow" style=${{ display: 'flex', justifyContent: 'center' }}><${Search} dark S=${S} contextChannel=${cid} onOpenThread=${id => { const th = S.thread(id); setView('ch:' + th.channel); setOpenId(id); }} onOpenChannel=${id => go('ch:' + id)} /></div><span style=${{ width: 200, textAlign: 'right' }}><${Avatar} who=${ME} /></span>`}
  </div>`;

  if (phone) {
    if (screen === 'search') return html`<${Search} S=${S} full autoOpen onClose=${() => setScreen('home')} onOpenThread=${id => { setView('ch:' + S.thread(id).channel); openThread(id); }} onOpenChannel=${id => go('ch:' + id)} />`;
    if (screen === 'thread' && t) return html`<${Panel} />`;
    if (screen === 'main') return html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%' }}><div className="scroll" style=${{ flex: 1, background: 'var(--b2-grey)' }}><${Main} /></div></div>`;
    return html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%' }}>${Top}<div className="scroll" style=${{ flex: 1, background: '#22272e' }}><${Side} /></div></div>`;
  }
  return html`<div className="B2-grid">
    ${Top}
    <${Side} />
    <div className="B-main" style=${{ background: 'var(--b2-grey)' }}><div className="scroll" style=${{ flex: 1 }}><${Main} /></div><${Panel} /></div>
  </div>`;
}

/* ------------------------------------------------------------------ prototype shell */
const VARIANTS = [
  { key: 'A', name: 'Three-pane triage', C: VariantA },
  { key: 'B', name: 'Channel-first, Pings in a bell', C: VariantB },
  { key: 'C', name: 'Focus queue, one Ping at a time', C: VariantC },
  { key: 'B2', name: 'B revised: dark chrome, Channel bar, Sections', C: VariantB2 },
];
function getParam(k, d) { return new URLSearchParams(location.search).get(k) || d; }
function setParam(k, v) { const u = new URL(location.href); u.searchParams.set(k, v); history.replaceState(null, '', u); }
function App() {
  const S = useAppState();
  const [v, setV] = useState(getParam('variant', 'B2'));
  const [frame, setFrame] = useState(getParam('frame', 'laptop'));
  const i = Math.max(0, VARIANTS.findIndex(x => x.key === v));
  const go = (d) => { const n = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key; setV(n); setParam('variant', n); };
  useEffect(() => {
    const h = (e) => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  const V = VARIANTS[i];
  const phone = frame === 'phone';
  const body = html`<${V.C} key=${V.key + frame} phone=${phone} />`;
  return html`<${Ctx.Provider} value=${S}>
    ${phone ? html`<div className="stage-phone-wrap"><div className="stage-phone">${body}</div></div>` : html`<div className="stage-laptop">${body}</div>`}
    ${S.toast && html`<div className="toast">${S.toast}</div>`}
    <div className="proto-bar">
      <button onClick=${() => go(-1)}>←</button>
      <span><b>${V.key}</b> (${V.name})</span>
      <button onClick=${() => go(1)}>→</button>
      <span style=${{ color: '#aaa' }}>state: Pings ${S.pinged.length} · To Do ${S.todo.length}</span>
      <span className="proto-frame">${['laptop', 'phone'].map(f => html`<button key=${f} className=${frame === f ? 'on' : ''} onClick=${() => { setFrame(f); setParam('frame', f); }}>${f === 'laptop' ? '💻 Laptop' : '📱 Phone'}</button>`)}</span>
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
